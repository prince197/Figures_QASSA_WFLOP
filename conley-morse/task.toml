[task]
name = "afterquery/conley-morse"
description = "Build a reusable solver for long Conley Morse continuation trajectories and recover exact Conley and Morse-graph transport invariants on unseen parameter families."
authors = [{ name = "Anonymous Submission Author", email = "anonymous@example.invalid" }]
keywords = ["Conley index map", "Conley-Morse", "rigorous dynamics", "continuation", "cubical homology", "zigzag rank", "zigzag barcode", "Kronecker canonical form", "Morse graph"]

[metadata]
category = "Science"
subcategory = "Applied Mathematics & Scientific Computing"
difficulty_explanation = "The submitted artifact must reconstruct exact continuation relations for long, low-backtracking parameter trajectories in coupled nonlinear maps. Difficulty is not based on hidden syntax or output volume: every hidden query contains repeated bifurcation crossings where the selected Morse family branches and merges, so continuation must be represented as a linear relation rather than a one-to-one correspondence, and composed exactly; hidden windows are chosen so that some compositions pass through the zero relation and become nonzero again, which defeats solvers that treat the zero relation as absorbing. Every loop relation and every holonomy word must be classified up to conjugacy by its Kronecker invariants over F2 (right and left minimal indices, infinite and finite elementary divisors); on the Morse-graph layer these relations live on spaces of dimension up to 333 and mix full, zero, multivalued, kernel, nilpotent and identity blocks. Holonomy probes combine two closed endorelations A and B with their converses in the words A, B, AB, BA, ABA, BAB, AABB, BBAA, ABAB, BABA, Ab, aB, ABab and abAB, and the complete interval decomposition (barcode) of every Conley zigzag and every Morse-graph zigzag is required in all degrees. The Morse-graph H1 zigzags have up to 9599 nodes carrying spaces of dimension up to 333 and 6309 to 13797 distinct intervals, many spanning thousands of nodes, so sweeping a composed relation from every start node (15.7 to 46.1 million relation compositions per query) cannot meet the 1500 second limit (it needs about three hours per case, while correct linear-sweep algorithms need minutes); a genuine zigzag persistence algorithm is required. In addition every hidden query asks for 24 discrete Conley index maps of Morse intervals: the map induced on H(K(P),K(E)) by chain selectors of the lower-semicontinuous acyclic carrier of the box map, for index pairs whose exit set consists of the boxes that can no longer reach the interval. These maps combine nilpotent Jordan blocks (from connecting orbits) with unipotent blocks and must be reported through their elementary divisors; the public example exhibits single-set and multi-set interval probes, but for interval probes it shows only index-space dimensions and index-map ranks and withholds the elementary divisors, so the Jordan structure of interval index maps must be derived from the definition. Hidden families use 34 by 34 to 36 by 36 phase grids, 210 to 225 parameters and trajectories of 2800 to 4800 steps. The data is synthetic but realistic and models rigorous finite representations used in parameterized nonlinear dynamics. Researchers in rigorous numerics, computational dynamics, computational topology, and topological data analysis perform closely related work."
solution_explanation = "The reference reconstructs exact rational outer approximations, recurrent SCCs, relative cubical Conley homology over F2, and continuation relations through union-frame SCCs. It propagates selected Morse families along each trajectory, computes sparse generalized ranks by composing linear relations arrow by arrow with no early exit, and computes the full Conley and Morse-graph barcodes by one left-to-right sweep that maintains, for all start nodes simultaneously, the range and multivalued-part flags of the composed relations as canonical reduced echelon subspaces, followed by inclusion-exclusion; the largest Morse-graph H1 barcode takes about 12 seconds. Loop and holonomy relations keep the complete relation subspace; Kronecker invariants are read from the dimensions of the functorial chains R^j(0), R^-j(0), R^k(U), R^-k(U) and from the elementary divisors of the automorphism induced on the regular core (characteristic polynomial factorisation over F2). A second layer performs the analogous construction on H0 and H1 of the Morse reachability graph. Conley index maps come from an explicit chain selector of the acyclic carrier and elementary divisors of the induced map. Repeated complexes are cached, but other exact algorithms are valid."
verification_explanation = "The verifier treats /app/trajectory_solver.py as the only artifact. It compiles the source in memory, copies it into a fresh sandbox, and runs that copy as an unprivileged user on four hidden inputs; hidden inputs and sealed oracles remain unreadable to the child process. Every transported selection, node dimension, generalized-rank record, Conley and Morse-graph barcode, loop signature, holonomy-word signature (including Kronecker invariants) and Conley index map must match exactly, and all four hidden families must pass. Each hidden invocation has the disclosed 1500 second wall-clock limit, at least 3.7 times the slowest correct implementation measured on a slow host and 7 or more times below the quadratic per-start sweep. The sealed oracles were regenerated after removing an invalid absorbing-zero shortcut from the oracle generator; that shortcut is now an ablation that fails every hidden family. The reference passes all hidden cases, and an independent implementation that shares no relation, Kronecker or barcode code with the reference (section-space relations, polynomial-ring pencil ranks, per-start rank sweeps, and a right-to-left domain and kernel sweep for barcodes) reproduces all four sealed oracles exactly."
