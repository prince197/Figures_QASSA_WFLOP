schema_version = "1.4"

artifacts = ["/app/output/layout.csv", "/app/output/yield.json"]

[task]
name = "afterquery/wind-layout-yield"
description = "Build the 2004-2023 hub-height wind climate from a three-year met mast and twenty-year reanalysis and station references, optimise a 24-turbine layout in a circular lease under a Jensen wake model, and report the long-term net yield it delivers."
authors = [{ name = "Dr. Prince", email = "princesolanki197@gmail.com" }]
keywords = ["wind farm layout optimization", "WFLOP", "MCP long-term correction", "wind resource assessment", "Jensen wake model", "regression dilution"]

[metadata]
author_name = "Dr. Prince"
author_email = "princesolanki197@gmail.com"
author_organization = "IIT Roorkee"
author_profile = "https://scholar.google.com/citations?user=5aKFLTAAAAAJ&hl=en"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "mathematical-sciences"
field = "applied-mathematics"
subfield = "Wind farm layout optimization (WFLOP) with wake models and metaheuristics"
category = "Science"
subcategory = "Applied Mathematics & Scientific Computing"
tags = ["wind farm layout optimization", "WFLOP", "MCP long-term correction", "wind resource assessment", "Jensen wake model", "regression dilution"]
expert_time_estimate_hours = 8
relevant_experience = "PhD research on wind farm layout optimization; developed QA-SSA and benchmarked it against SSA, BBO, EA, ACO and PF on the Kusiak-Song circular-farm WFLOP (500/750/1000 m radii, two wind data sets) under a Jensen wake model."
difficulty_explanation = "Synthetic data from a disclosed seeded generator; the truth is the clean hourly hub-height wind for 2004-2023, written before the mast, reanalysis and station measurement models. The task is a pre-construction energy-yield assessment in which several dependent expert decisions feed a hard optimisation. (1) MCP method: the three-year mast campaign is about 10% windier than the long term, and the references correlate only moderately with the site (r ~0.84 and 0.81). Regression-type and conditional analog MCP suffer regression dilution and carry the anomaly into the long term (+1 to +5%, invisible to leave-one-year-out checks); a variance-preserving mapping is required. Skipping MCP gives +14 to +22%. (2) The reanalysis reads about 6% low before a mid-2012 input-stream change visible only against the station (-2 to -3% if missed). (3) The two 60 m cups are tower-shadowed on opposite booms; averaging them gives about -4.5%. (4) Iced-cup episodes: about -9%. (5) Diurnal shear must be measured; 1/7 gives -2 to -3%. (6) The reanalysis direction is veered by about 14 deg; an uncorrected rose leaves the layout about 0.9% below the best. (7) 24 turbines at 4D spacing in a 1 km radius is nonconvex; ring or coarse-sector layouts lose 2.3-5%."
solution_explanation = "Mast QC (gaps, iced episodes); tower shadow handled by using the 60 m cup whose boom faces the wind; hour-of-day shear from the same-boom 40/60 m pair; change-point homogenisation of the reanalysis against the station; veer from concurrent directions; per 30-deg sector, a least-squares combination of reanalysis and station speed mapped to hub height by variance ratio (variance-preserving, so the windy concurrent period is not regressed into the long term); 1-deg wind rose with empirical power tables; multi-start random search plus simulated-annealing polish; yield evaluated hour by hour on the long-term series. An independent implementation (equal-weight two-reference variance ratio, CUSUM break detection, ratio-based cup selection, per-record shear, simulated annealing) passes on all calibration seeds; the verifier requires none of these specific choices."
verification_explanation = "Ground truth is the clean hourly 80 m speed and direction for 2004-2023, written by the generator before any measurement model; it is independent of every solver. The verifier re-evaluates the submitted layout over all 175,320 hours with the stated wake model. Gates: feasibility (r <= 1000 m and pairwise spacing >= 308 m, 0.1 m tolerance); layout quality, 1 - P_true/P_best <= 0.75%, where P_best = 12,710.22 kW is the best true power found by a truth-informed search plus the calibration solvers; yield accuracy, |P_reported/P_true - 1| <= 2.0%. Over 30 regenerated seeds, reference worst 0.30% / 1.05% and independent worst 0.31% / 1.17%. Regression and analog MCP (+3.1% median), no-homogenisation, averaged-cup, no-QC, mast-only, 1/7-shear, no-veer, coarse-sector and ring routes fail on the shipped instance."

[verifier]
