schema_version = "1.4"

artifacts = ["/app/output/layout.csv", "/app/output/yield.json"]

[task]
name = "afterquery/wind-layout-yield"
description = "Build the 2004-2023 hub-height wind climate from a three-year met mast and twenty-year reanalysis and station references, optimise a 24-turbine layout in a circular lease under a Jensen wake model, and report the long-term net yield it delivers."
authors = [{ name = "Dr. Prince", email = "princesolanki197@gmail.com" }]
keywords = ["wind farm layout optimization", "WFLOP", "MCP long-term correction", "wind resource assessment", "Jensen wake model", "metaheuristics"]

[metadata]
author_name = "Dr. Prince"
author_email = "princesolanki197@gmail.com"
author_organization = "IIT Roorkee"
author_profile = "https://scholar.google.com/citations?user=5aKFLTAAAAAJ&hl=en"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "mathematical-sciences"
field = "applied-mathematics"
subfield = "Wind farm layout optimization (WFLOP) with wake models and metaheuristics"
category = "Science"
subcategory = "Applied Mathematics & Scientific Computing"
tags = ["wind farm layout optimization", "WFLOP", "MCP long-term correction", "wind resource assessment", "Jensen wake model", "metaheuristics"]
expert_time_estimate_hours = 8
relevant_experience = "PhD research on wind farm layout optimization; developed QA-SSA and benchmarked it against SSA, BBO, EA, ACO and PF on the Kusiak-Song circular-farm WFLOP (500/750/1000 m radii, two wind data sets) under a Jensen wake model."
difficulty_explanation = "Synthetic data from a disclosed seeded generator; the truth is the clean hourly hub-height wind for 2004-2023, written before the mast, reanalysis and station measurement models. The task is a pre-construction energy-yield assessment in which several dependent expert decisions feed a hard optimisation. (1) The mast covers only three windy years, so a long-term correction (MCP) is needed; mast-only yields are +6 to +12% high. (2) The reanalysis reads about 6% low before a mid-2012 input-stream change, which is visible only against the homogeneous station; MCP on the raw reanalysis is about -5% low. (3) The two 60 m cups sit on opposite booms and are tower-shadowed in the prevailing and secondary sectors; averaging them gives about -5%. (4) Iced-cup episodes: -8.6%. (5) Shear varies from day to night and must be measured; 1/7 gives -2.8%. (6) The reanalysis direction is veered by about 14 deg; an uncorrected long-term rose leaves the layout about 1% below the best. (7) 24 turbines at 4D spacing in a 1 km radius is nonconvex; weak or ring layouts lose 0.8-2.5%."
solution_explanation = "Mast QC (gaps, iced episodes); tower shadow handled by using the 60 m cup whose boom faces the wind; hour-of-day shear from the same-boom 40/60 m pair; change-point homogenisation of the reanalysis against the station; veer from concurrent directions; variance-ratio MCP per 30-deg sector to an hourly 2004-2023 hub-height series; 1-deg wind rose with empirical power tables; multi-start random search plus simulated-annealing polish; yield evaluated hour by hour on the long-term series. An independent implementation (quantile-mapping MCP, CUSUM break detection, ratio-based cup selection, per-record shear, simulated annealing) passes on all calibration seeds; the verifier requires none of these specific choices."
verification_explanation = "Ground truth is the clean hourly 80 m speed and direction for 2004-2023, written by the generator before any measurement model; it is independent of every solver. The verifier re-evaluates the submitted layout over all 175,320 hours with the stated wake model. Gates: feasibility (r <= 1000 m and pairwise spacing >= 308 m, 0.1 m tolerance); layout quality, 1 - P_true/P_best <= 0.75%, where P_best = 12,515.97 kW is the best true power found by a truth-informed search plus the calibration solvers; yield accuracy, |P_reported/P_true - 1| <= 2.5%. Over 30 regenerated seeds, reference worst 0.31% / 0.79% and independent worst 0.45% / 1.68%. No-homogenisation, averaged-cup, no-QC, mast-only, 1/7-shear, no-veer, coarse-sector and ring routes all fail on the shipped instance."

[verifier]
