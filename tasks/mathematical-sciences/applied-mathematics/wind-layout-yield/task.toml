schema_version = "1.4"

artifacts = ["/app/output/layout.csv", "/app/output/yield.json"]

[task]
name = "afterquery/wind-layout-yield"
description = "Turn a raw two-level met-mast record into a hub-height wind climate, optimise a 24-turbine layout in a circular lease under a Jensen wake model, and report a net-yield estimate the layout actually delivers."
authors = [{ name = "Dr. Prince", email = "princesolanki197@gmail.com" }]
keywords = ["wind farm layout optimization", "WFLOP", "Jensen wake model", "wind resource assessment", "met mast", "metaheuristics"]

[metadata]
author_name = "Dr. Prince"
author_email = "princesolanki197@gmail.com"
author_organization = "IIT Roorkee"
author_profile = "https://scholar.google.com/citations?user=5aKFLTAAAAAJ&hl=en"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "mathematical-sciences"
field = "applied-mathematics"
subfield = "Wind farm layout optimization (WFLOP) with wake models and metaheuristics"
category = "Science"
subcategory = "Applied Mathematics & Scientific Computing"
tags = ["wind farm layout optimization", "WFLOP", "Jensen wake model", "wind resource assessment", "met mast", "metaheuristics"]
expert_time_estimate_hours = 5
relevant_experience = "PhD research on wind farm layout optimization; developed QA-SSA and benchmarked it against SSA, BBO, EA, ACO and PF on the Kusiak-Song circular-farm WFLOP (500/750/1000 m radii, two wind data sets) under a Jensen wake model."
difficulty_explanation = "Synthetic data from a disclosed seeded generator; the truth is the clean hourly hub-height wind produced before the measurement model is applied. Four dependent decisions interact. (1) The resource: cups at 40 and 60 m, hub at 80 m. The shear must be measured from the cup pair: ignoring it biases yield by about -10%, and assuming 1/7 by -2 to -3.4%. (2) About 5% of hours are unheated-cup icing episodes that look like calms under a frozen vane; keeping them biases yield by -4.4 to -5.4%. (3) Directional resolution of the objective: with a top-hat Jensen wake and a fairly narrow rose, the textbook WFLOP recipe (12-36 sectors evaluated at centre lines, as in the Kusiak-Song benchmark) lets the optimiser park turbines just off each centre-line wake. The model then reports near-ideal efficiency, while the layout is 1.0-1.5% (10 deg) to 3.7-5.7% (30 deg) worse on the real hourly directions. (4) The yield must be the honest yield of the submitted layout: coarse-sector model outputs over-predict by 4.6-17%, and mean-speed shortcuts under-predict by about 20%. On top of this, 24 turbines in a 1 km radius at 4D spacing is a hard, nonconvex, discontinuous optimisation problem."
solution_explanation = "The oracle drops logger gaps and flags iced episodes: both cups below 1 m/s with a frozen vane for at least 3 h, in an event that touches sub-zero air. It measures the power-law shear exponent from the ratio of mean 60 m and 40 m speeds above 3 m/s and extrapolates the 60 m cup to 80 m. It builds a 1-degree wind rose with, for each direction bin, the empirical mean power as a function of the wake speed factor. A multi-start random-search optimiser with incremental O(B*N) move evaluation and feasibility-preserving moves then maximises the model. Finally it reports the net mean power of the final layout evaluated hour by hour on the cleaned hub-height series. Other valid routes exist (parametric Weibull/KDE climates, simulated annealing, gradient methods on a smoothed wake), and the verifier requires none of these choices."
verification_explanation = "Ground truth is the clean hourly hub-height speed and direction written by the generator before shear, cup and vane noise, icing and gaps are applied; it is independent of any solver. The verifier re-evaluates the submitted layout hour by hour over all 87,660 hours with the stated wake model. Gates: feasibility (r <= 1000 m and pairwise spacing >= 308 m, 0.1 m tolerance); layout quality, 1 - P_true/P_best <= 0.75%, where P_best = 12,838.06 kW is the best true power found by a truth-informed search plus the calibration solvers; yield accuracy, |P_reported/P_true - 1| <= 2.0%. Calibration on 30 regenerated seeds: reference worst 0.20% / 0.94%, independent implementation worst 0.36% / 1.24%. The 10-deg-sector, 1/7-shear, no-QC, no-shear, ring and random routes all fail (0/10)."

